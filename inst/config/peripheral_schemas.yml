EA:
  name: "Elemental Analyzer IRMS"
  description: "Bulk isotope analysis via elemental combustion"
  data_shape: "sample_per_row"
  analysis_type: "bulk"

  column_mapping:
    identifier: "Identifier 1"
    amount: "Amount"
    peak_number: "Peak Nr"

    isotope_ratio: "d {isotope_mass}{element}/{reference_isotope_mass}{element}"

    area_all: "Area All"

    area:
      "{mass}": "Area {mass}"

    amplitude:
      "{mass}": "Ampl  {mass}"

    background:
      "{mass}": "BGD {mass}"

    time: "Time Code"

  measurement_masses:
    - 44
    - 45
    - 46

  validation:
    peak_numbers_to_keep: [3]
    exclude_identifiers: ["on_off", "linearity"]
    required_columns:
      - "identifier"
      - "peak_number"
      - "isotope_ratio"

  metadata:
    use_standards_database: true
    standards_match_column: "identifier"
    blank_identifier_pattern: "Blank"

  replicates:
    identify_by: "name_pattern"
    pattern: "^(.+?)(_\\d+)?$"
    group_column: null


GC:
  name: "Gas Chromatograph IRMS"
  description: "Compound-specific isotope analysis"
  data_shape: "peak_per_row"
  analysis_type: "compound_specific"

  column_mapping:
    injection_id: "Index"
    sample_id: "Label"
    analysis_no: "Analysis No."
    comment: "Comment"
    sample_type: "Sample Type"
    method_name: "ConFlo Method"
    status: "Status"
    start_time: "Start Time"
    stop_time: "Stop Time"

    peak_number: "Peak Number"

    isotope_ratio: "d{isotope_mass}{element}"
    retention_time: "RetentionTime {reference_mass}.00 m/z"
    peak_amplitude: "PeakAmplitude {reference_mass}.00 m/z"
    peak_area: "PeakArea {reference_mass}.00 m/z"

  validation:
    required_columns:
      - "injection_id"
      - "sample_id"
      - "analysis_no"
      - "peak_number"
      - "isotope_ratio"
      - "retention_time"
      - "peak_amplitude"
      - "peak_area"

  metadata:
    use_compound_library: true
    compound_library_path: "config/gc_compound_library.yml"

  replicates:
    identify_by: "analysis_no"
    group_column: "sample_id"


GB:
  name: "Gasbench IRMS"
  description: "High-throughput bulk isotope analysis"
  data_shape: "sample_per_row"
  analysis_type: "bulk"

  column_mapping:
    identifier: "Sample"

    isotope_ratio: "d{isotope_mass}{element}"

    signal: "Amplitude"
    reference_delta: "Reference delta"
    delta_difference: "Dd"

  validation:
    required_columns:
      - "identifier"
      - "isotope_ratio"

  metadata:
    use_standards_database: false

  replicates:
    identify_by: "name_pattern"
    pattern: "^(.+?)(_\\d+)?$"
    group_column: null
